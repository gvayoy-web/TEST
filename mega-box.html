<style>
/* ===== LOCAL: caja brawl (misma secuencia que index.html) ===== */
.brawlbox-overlay {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at center, rgba(25,5,60,0.97) 0%, rgba(10,2,30,0.99) 50%, rgba(0,0,0,1) 100%);
    z-index: 600; display: flex; flex-direction: column; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; overflow: hidden; transition: opacity 0.4s ease;
}
.brawlbox-overlay::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(circle at 30% 20%, rgba(255,214,10,0.08) 0%, transparent 50%),
                radial-gradient(circle at 70% 80%, rgba(255,100,50,0.06) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(180,50,255,0.05) 0%, transparent 60%);
    pointer-events: none; z-index: 0;
    animation: overlayPulse 4s ease-in-out infinite;
    animation-play-state: var(--anim-play, running);
}
@keyframes overlayPulse {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
}
.brawlbox-overlay.visible { pointer-events: auto; }
.brawlbox-rays {
    position: absolute; inset: -50%;
    background:
        conic-gradient(from 0deg,
            transparent 0deg, rgba(255,214,10,0.35) 4deg, rgba(255,180,50,0.2) 8deg, transparent 12deg,
            transparent 30deg, rgba(255,100,50,0.25) 34deg, rgba(255,60,80,0.15) 38deg, transparent 42deg,
            transparent 60deg, rgba(200,100,255,0.2) 64deg, rgba(150,50,255,0.12) 68deg, transparent 72deg,
            transparent 90deg, rgba(255,214,10,0.3) 94deg, rgba(255,200,80,0.18) 98deg, transparent 102deg,
            transparent 120deg, rgba(255,80,120,0.22) 124deg, rgba(255,50,100,0.14) 128deg, transparent 132deg,
            transparent 150deg, rgba(100,200,255,0.18) 154deg, rgba(80,150,255,0.1) 158deg, transparent 162deg,
            transparent 180deg, rgba(255,214,10,0.32) 184deg, rgba(255,160,30,0.2) 188deg, transparent 192deg,
            transparent 210deg, rgba(255,120,60,0.24) 214deg, rgba(255,80,80,0.16) 218deg, transparent 222deg,
            transparent 240deg, rgba(180,80,255,0.2) 244deg, rgba(140,40,255,0.12) 248deg, transparent 252deg,
            transparent 270deg, rgba(255,214,10,0.28) 274deg, rgba(255,190,60,0.16) 278deg, transparent 282deg,
            transparent 300deg, rgba(255,60,120,0.2) 304deg, rgba(255,40,80,0.12) 308deg, transparent 312deg,
            transparent 330deg, rgba(120,180,255,0.16) 334deg, rgba(100,140,255,0.1) 338deg, transparent 342deg,
            transparent 360deg
        );
    animation: rayspin 5s linear infinite;
    animation-play-state: var(--anim-play, running);
}
.brawlbox-rays::after {
    content: ''; position: absolute; inset: 10%;
    background: conic-gradient(from 180deg,
        transparent 0deg, rgba(255,214,10,0.15) 10deg, transparent 20deg,
        transparent 90deg, rgba(255,100,80,0.12) 100deg, transparent 110deg,
        transparent 180deg, rgba(200,120,255,0.1) 190deg, transparent 200deg,
        transparent 270deg, rgba(255,214,10,0.13) 280deg, transparent 290deg,
        transparent 360deg
    );
    animation: rayspin 8s linear infinite reverse;
    animation-play-state: var(--anim-play, running);
    opacity: 0.7;
}
@keyframes rayspin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.brawlbox-stage { position: relative; width: 240px; height: 240px; z-index: 2; }
.brawlbox-box {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 7rem;
    filter: drop-shadow(0 0 40px rgba(255,214,10,0.9)) drop-shadow(0 0 80px rgba(255,214,10,0.5)) drop-shadow(0 0 120px rgba(255,180,50,0.3));
    color: #ffd60a;
    animation: boxGlow 2s ease-in-out infinite;
    animation-play-state: var(--anim-play, running);
}
@keyframes boxGlow {
    0%, 100% {
        filter: drop-shadow(0 0 40px rgba(255,214,10,0.9)) drop-shadow(0 0 80px rgba(255,214,10,0.5)) drop-shadow(0 0 120px rgba(255,180,50,0.3));
    }
    50% {
        filter: drop-shadow(0 0 60px rgba(255,214,10,1)) drop-shadow(0 0 100px rgba(255,214,10,0.7)) drop-shadow(0 0 150px rgba(255,180,50,0.5));
    }
}
.brawlbox-glow { position: absolute; inset: 0; margin: auto; width: 70px; height: 70px; background: #ffd60a; border-radius: 50%; filter: blur(30px); opacity: 0; }
.brawlbox-star {
    position: absolute; width: 45px; height: 45px; opacity: 0;
    color: #ffd60a; fill: currentColor;
    filter: drop-shadow(0 0 12px #ffd60a) drop-shadow(0 0 25px rgba(255,214,10,0.6));
    animation: starTwinkle 1.5s ease-in-out infinite;
    animation-play-state: var(--anim-play, running);
}
@keyframes starTwinkle {
    0%, 100% { filter: drop-shadow(0 0 12px #ffd60a) drop-shadow(0 0 25px rgba(255,214,10,0.6)); }
    50% { filter: drop-shadow(0 0 20px #ffd60a) drop-shadow(0 0 40px rgba(255,214,10,0.8)); }
}
.brawlbox-text {
    margin-top: 25px; font-weight: 900;
    color: #ffd60a;
    text-shadow: 0 0 10px rgba(255,214,10,0.8), 0 0 30px rgba(255,214,10,0.5), 0 0 60px rgba(255,180,50,0.3), 4px 4px 0px #10021f;
    font-size: 1.8rem; letter-spacing: 0.08em; text-align: center; opacity: 0; z-index: 2; position: relative;
    animation: textGlow 2s ease-in-out infinite;
    animation-play-state: var(--anim-play, running);
}
@keyframes textGlow {
    0%, 100% { text-shadow: 0 0 10px rgba(255,214,10,0.8), 0 0 30px rgba(255,214,10,0.5), 0 0 60px rgba(255,180,50,0.3), 4px 4px 0px #10021f; }
    50% { text-shadow: 0 0 15px rgba(255,214,10,1), 0 0 40px rgba(255,214,10,0.7), 0 0 80px rgba(255,180,50,0.5), 4px 4px 0px #10021f; }
}
.brawlbox-skip {
    position: absolute; bottom: 28px; right: 28px;
    background: rgba(0,0,0,0.7); border: 2px solid rgba(255,214,10,0.5);
    color: rgba(255,214,10,0.8); font-family: var(--font-mono); font-size: 0.75rem;
    padding: 10px 16px; cursor: pointer; z-index: 3;
    opacity: 0.7; transition: opacity 0.2s, background 0.2s, border-color 0.2s, box-shadow 0.2s;
    backdrop-filter: blur(8px);
}
.brawlbox-skip:hover { opacity: 1; background: rgba(255,214,10,0.15); border-color: #ffd60a; color: #ffd60a; box-shadow: 0 0 15px rgba(255,214,10,0.3); }

/* tarjeta de resultado tras la secuencia */
.result-window {
    max-width: 520px; margin: 80px auto; text-align: center;
    animation: resultAppear 0.6s ease-out both;
}
@keyframes resultAppear {
    0% { opacity: 0; transform: translateY(30px) scale(0.95); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
}
.result-window .window-body { position: relative; }
/* esquina tipo retícula láser */
.result-window .window-body::before {
    content: ''; position: absolute; top: 14px; left: 14px; width: 22px; height: 22px;
    border-top: 3px solid var(--accent); border-left: 3px solid var(--accent);
    opacity: 0.6; pointer-events: none; z-index: 6;
    filter: drop-shadow(0 0 6px var(--accent));
}
.result-window .window-body::after {
    content: ''; position: absolute; top: 0; bottom: 0; left: -20%; width: 45%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,0.5), transparent);
    transform: translateX(-130%) skewX(-18deg);
    animation: resultShimmer 1s ease-out 0.35s both;
    pointer-events: none; z-index: 6;
}
@keyframes resultShimmer { 0% { transform: translateX(-130%) skewX(-18deg); } 100% { transform: translateX(260%) skewX(-18deg); } }
.result-icon {
    position: relative; width: 96px; height: 96px; margin: 6px auto 18px; color: var(--accent);
    --halo: rgba(236,21,96,0.45);
    animation: iconFloat 3.4s ease-in-out infinite;
    animation-play-state: var(--anim-play, running);
}
@keyframes iconFloat { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-8px) rotate(3deg); } }
.result-icon::before {
    content: ''; position: absolute; inset: -25px; border-radius: 50%;
    background: radial-gradient(circle, var(--halo), transparent 70%);
    filter: blur(8px); pointer-events: none; z-index: 0;
    animation: haloPulse 2.8s ease-in-out infinite;
    animation-play-state: var(--anim-play, running);
}
@keyframes haloPulse { 0%, 100% { opacity: 0.75; transform: scale(1); } 50% { opacity: 1; transform: scale(1.15); } }
/* anillo discontinuo girando alrededor del premio */
.result-icon::after {
    content: ''; position: absolute; inset: -38px; border-radius: 50%;
    border: 2px dashed var(--halo); opacity: 0.5;
    animation: ringSpin 10s linear infinite;
    animation-play-state: var(--anim-play, running);
    pointer-events: none; z-index: 0;
}
@keyframes ringSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.result-icon svg {
    position: relative; width: 100%; height: 100%; z-index: 1;
    filter: drop-shadow(0 0 14px var(--halo)) drop-shadow(0 0 30px var(--halo));
    animation: iconPulse 2s ease-in-out infinite;
    animation-play-state: var(--anim-play, running);
}
@keyframes iconPulse {
    0%, 100% { filter: drop-shadow(0 0 14px var(--halo)) drop-shadow(0 0 30px var(--halo)); }
    50% { filter: drop-shadow(0 0 20px var(--halo)) drop-shadow(0 0 45px var(--halo)); }
}
.result-icon.rarity-epico { --halo: rgba(225,29,72,0.55); }
.result-icon.rarity-especial { --halo: rgba(2,132,199,0.55); }
.result-icon.rarity-super-raro { --halo: rgba(236,23,137,0.55); }
.result-icon.rarity-mitico { --halo: rgba(234,88,12,0.6); }
.result-icon.rarity-legendario { --halo: rgba(255,214,10,0.65); }
.result-icon.rarity-ultralegendario { --halo: rgba(255,214,10,0.9); }
.result-title {
    font-family: var(--font-serif); font-style: italic; font-weight: 700; font-size: 2.2rem;
    letter-spacing: -0.01em; margin-bottom: 10px; color: var(--ink);
    position: relative; display: inline-block;
    text-shadow: 0 2px 8px rgba(0,0,0,0.15), 0 0 20px rgba(236,21,96,0.1);
}
.result-title::after {
    content: ''; position: absolute; left: 0; right: -12px; bottom: -6px; height: 4px;
    background:
        linear-gradient(90deg, transparent 0 6px, var(--accent) 6px 14px, transparent 14px 20px, var(--accent-2) 20px 30px, transparent 30px 36px, var(--accent) 36px 46px, transparent 46px);
    background-size: 46px 4px; opacity: 0.75;
    filter: drop-shadow(0 0 4px var(--accent));
}
.result-desc { font-size: 1.05rem; line-height: 1.8; font-weight: 500; margin-bottom: 26px; }
.result-actions { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }
.result-actions .btn-volver { position: static; }
.btn-replay {
    background: var(--accent); color: var(--card); border: var(--border-w) solid var(--ink);
    padding: 10px 18px; font-weight: 900; font-size: 0.9rem; text-transform: uppercase; cursor: pointer;
    box-shadow: 4px 4px 0 var(--ink); font-family: var(--font-display);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    position: relative; overflow: hidden;
}
.btn-replay::after {
    content: '↻ '; display: inline-block; font-size: 1rem; vertical-align: -1px;
    transition: transform 0.3s ease;
}
.btn-replay:hover::after { transform: rotate(-360deg); }
.btn-replay:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--ink); }
.btn-replay:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
.btn-replay:focus-visible { outline: 3px solid var(--accent-2); outline-offset: 2px; }

/* partículas flotantes decorativas */
.brawlbox-particles { position: absolute; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
.brawlbox-particle {
    position: absolute; width: 4px; height: 4px; border-radius: 50%;
    background: var(--p-color, #ffd60a);
    box-shadow: 0 0 6px var(--p-color, #ffd60a), 0 0 12px var(--p-color, #ffd60a);
    opacity: 0;
    animation: particleFloat var(--p-dur, 4s) ease-in-out infinite;
    animation-delay: var(--p-delay, 0s);
    animation-play-state: var(--anim-play, running);
}
@keyframes particleFloat {
    0% { opacity: 0; transform: translateY(100vh) scale(0); }
    20% { opacity: 1; }
    80% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-20vh) scale(1); }
}
.brawlbox-particle:nth-child(1) { left: 10%; --p-color: #ffd60a; --p-dur: 3.5s; --p-delay: 0s; width: 5px; height: 5px; }
.brawlbox-particle:nth-child(2) { left: 25%; --p-color: #ff8c00; --p-dur: 4.2s; --p-delay: 0.5s; width: 3px; height: 3px; }
.brawlbox-particle:nth-child(3) { left: 40%; --p-color: #ffd60a; --p-dur: 3.8s; --p-delay: 1s; }
.brawlbox-particle:nth-child(4) { left: 55%; --p-color: #c850ff; --p-dur: 4.5s; --p-delay: 1.5s; width: 6px; height: 6px; }
.brawlbox-particle:nth-child(5) { left: 70%; --p-color: #ffd60a; --p-dur: 3.2s; --p-delay: 0.8s; }
.brawlbox-particle:nth-child(6) { left: 85%; --p-color: #ff5070; --p-dur: 4s; --p-delay: 2s; width: 3px; height: 3px; }
.brawlbox-particle:nth-child(7) { left: 15%; --p-color: #ffb040; --p-dur: 3.6s; --p-delay: 2.5s; width: 4px; height: 4px; }
.brawlbox-particle:nth-child(8) { left: 60%; --p-color: #ffd60a; --p-dur: 4.3s; --p-delay: 0.3s; width: 5px; height: 5px; }
.brawlbox-particle:nth-child(9) { left: 35%; --p-color: #ff6080; --p-dur: 3.9s; --p-delay: 1.8s; }
.brawlbox-particle:nth-child(10) { left: 80%; --p-color: #c850ff; --p-dur: 4.1s; --p-delay: 1.2s; width: 3px; height: 3px; }
.brawlbox-particle:nth-child(11) { left: 5%; --p-color: #ffd60a; --p-dur: 3.7s; --p-delay: 3s; width: 6px; height: 6px; }
.brawlbox-particle:nth-child(12) { left: 48%; --p-color: #ff8c00; --p-dur: 4.4s; --p-delay: 0.7s; width: 4px; height: 4px; }

/* destello decorativo adicional */
.brawlbox-flare {
    position: absolute; width: 200px; height: 200px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,214,10,0.25) 0%, transparent 70%);
    top: 50%; left: 50%; transform: translate(-50%, -50%);
    pointer-events: none; z-index: 1; opacity: 0;
    animation: flarePulse 3s ease-in-out infinite;
    animation-play-state: var(--anim-play, running);
}
@keyframes flarePulse {
    0%, 100% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
    50% { opacity: 0.6; transform: translate(-50%, -50%) scale(1.3); }
}

@media (max-width: 480px) {
    .brawlbox-stage { width: 200px; height: 200px; }
    .brawlbox-box { font-size: 6rem; }
    .brawlbox-text { font-size: 1.4rem; }
    .result-title { font-size: 1.5rem; }
    .result-window { margin: 60px auto; }
    .result-window .window-body { padding: 20px 16px; }
    .result-actions { flex-direction: column; gap: 10px; }
    .result-actions .btn-volver,
    .btn-replay { width: 100%; text-align: center; }
}
</style>
</head>
<body class="theme-brawl">
    <div class="bg-layer" aria-hidden="true"></div>

    <main class="container" id="app"></main>

    <!-- estructura requerida por playBrawlBoxSequence (shared.js) -->
    <div class="brawlbox-overlay" id="brawlboxOverlay">
        <div class="brawlbox-rays"></div>
        <div class="brawlbox-particles">

            <div class="brawlbox-particle"></div>

            <div class="brawlbox-particle"></div>

        </div>

                <svg viewBox="0 0 24 24" fill="currentColor" width="120" height="120"><path d="M20 6h-4V4c0-1.1-.9-2-2-2h-4c-1.1 0-2 .9-2 2v2H4c-1.1 0-2 .9-2 2v11c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zM10 4h4v2h-4V4zm10 15H4V8h16v11z"/><circle cx="12" cy="13" r="2" fill="#10021f"/></svg>
            </div>

            <svg class="brawlbox-star" id="star2" style="top:2%; right:10%;" viewBox="0 0 24 24"><path d="M12 2l3 7 7 1-5 5 1 7-6-4-6 4 1-7-5-5 7-1z"/></svg>
            <svg class="brawlbox-star" id="star3" style="bottom:5%; left:15%;" viewBox="0 0 24 24"><path d="M12 2l3 7 7 1-5 5 1 7-6-4-6 4 1-7-5-5 7-1z"/></svg>
            <svg class="brawlbox-star" id="star4" style="bottom:10%; right:5%;" viewBox="0 0 24 24"><path d="M12 2l3 7 7 1-5 5 1 7-6-4-6 4 1-7-5-5 7-1z"/></svg>

<script>
(function initMegaBox(){
    const app = document.getElementById('app');
    const reward = getRewardFromContext();
    const reduced = prefersReducedMotion();

    if (reduced) {
        document.body.style.setProperty('--anim-play', 'paused');
    } else {
        document.addEventListener('visibilitychange', () => {
            document.body.style.setProperty('--anim-play', document.hidden ? 'paused' : 'running');
        });
    }

    document.body.className = 'theme-brawl';

    function renderError(){
        app.innerHTML = `
            <div class="window-card error-window result-window">
                <div class="window-header"><span>mega_caja.exe</span><span class="window-dots"><span class="dot dot-red"></span><span class="dot dot-yellow"></span><span class="dot dot-green"></span></span></div>
                <div class="window-body">
                    <span class="error-icon" aria-hidden="true">🎁</span>
                    <h2>ESTA CAJA ESPERA TU CÓDIGO</h2>
                    <p>Abre el cofre y canjea un código ultralegendario para abrir la Mega Caja.</p>
                    <a class="btn-volver" style="position:static; margin:0 auto;" href="./index.html#brawl">← volver al cofre</a>
                </div>
            </div>`;
    }

    function renderResult(r){
        const rarityName = (RARITY_META[r.rarity] || {}).name || r.rarity;
        app.innerHTML = `
            <div class="window-card result-window">
                <div class="window-header">
                    <span>premio_revelado.exe</span>
                    <span class="window-dots"><span class="dot dot-red"></span><span class="dot dot-yellow"></span><span class="dot dot-green"></span></span>
                </div>
                <div class="window-body">
                    <span class="rarity-tag rarity-${r.rarity}" aria-label="Rareza: ${rarityName}">${rarityName}</span>
                    <div class="result-icon rarity-${r.rarity}" aria-hidden="true">${r.icon}</div>
                    <h1 class="result-title">${r.title}</h1>
                    <p class="result-desc">${r.desc}</p>
                    <div class="result-actions">
                        <a class="btn-volver" href="./index.html#brawl">← volver al cofre</a>
                        <button type="button" class="btn-replay" id="replayBtn">ver de nuevo</button>
                    </div>
                </div>
            </div>`;
        document.getElementById('replayBtn').addEventListener('click', () => {
            document.getElementById('app').style.display = 'none';
            playBrawlBoxSequence(r);
        });
    }

    if (!reward) { renderError(); return; }

    /* al terminar la secuencia (o al saltar) se muestra el resultado */
    window.brawlBoxCompleted = (r) => {
        if (!r) return;
        document.getElementById('app').style.display = '';
        renderResult(r);
    };

    /* la secuencia arranca sola al cargar; el resultado aparece al cerrar */
    playBrawlBoxSequence(reward);

    /* ==========================================================================
       BRAWL STARS ENHANCED EFFECTS (mega-box.html)
       ========================================================================== */
    
    // Add floating Brawl Stars particles
    function addBrawlFloatingElements() {
        // Floating stars
        for (let i = 0; i < 6; i++) {
            const star = document.createElement('div');
            star.style.cssText = `
                position: fixed;
                width: ${15 + Math.random() * 20}px;
                height: ${15 + Math.random() * 20}px;
                left: ${Math.random() * 100}%;
                top: ${Math.random() * 100}%;
                background: ${['#ffd60a', '#17d4ff', '#ff2d55', '#7c3aed'][Math.floor(Math.random() * 4)]};
                clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
                opacity: 0.2;
                pointer-events: none;
                z-index: 1;
                animation: brawlStarFloat ${8 + Math.random() * 10}s ease-in-out infinite;
                animation-delay: ${Math.random() * 5}s;
            `;
            document.body.appendChild(star);
        }
        
        // Floating gems
        for (let i = 0; i < 4; i++) {
            const gem = document.createElement('div');
            gem.style.cssText = `
                position: fixed;
                width: ${10 + Math.random() * 15}px;
                height: ${10 + Math.random() * 15}px;
                left: ${Math.random() * 100}%;
                top: ${Math.random() * 100}%;
                background: linear-gradient(135deg, #00e5ff, #7c3aed);
                clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
                opacity: 0.15;
                pointer-events: none;
                z-index: 1;
                animation: brawlGemFloat ${10 + Math.random() * 8}s ease-in-out infinite;
                animation-delay: ${Math.random() * 5}s;
            `;
            document.body.appendChild(gem);
        }
    }
    
    // Click/tap burst effect
    document.addEventListener('click', (e) => {
        if (!e.target.closest('button, a')) {
            createBrawlBurst(e.clientX, e.clientY);
        }
    });
    
    document.addEventListener('touchstart', (e) => {
        if (!e.target.closest('button, a')) {
            const touch = e.touches[0];
            createBrawlBurst(touch.clientX, touch.clientY);
        }
    }, { passive: true });
    
    function createBrawlBurst(x, y) {
        const colors = ['#ffd60a', '#17d4ff', '#ff2d55', '#7c3aed', '#ffffff'];
        for (let i = 0; i < 12; i++) {
            const particle = document.createElement('div');
            particle.style.cssText = `
                position: fixed;
                left: ${x}px;
                top: ${y}px;
                width: ${4 + Math.random() * 6}px;
                height: ${4 + Math.random() * 6}px;
                background: ${colors[Math.floor(Math.random() * colors.length)]};
                border-radius: 50%;
                pointer-events: none;
                z-index: 1000;
                animation: brawlBurstParticle ${0.6 + Math.random() * 0.6}s ease-out forwards;
                --tx: ${(Math.random() - 0.5) * 300}px;
                --ty: ${(Math.random() - 0.5) * 300}px;
            `;
            document.body.appendChild(particle);
            particle.addEventListener('animationend', () => particle.remove(), { once: true });
            setTimeout(() => particle.remove(), 1300);
        }
    }
    
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', addBrawlFloatingElements);
    } else {
        addBrawlFloatingElements();
    }
    
    // Add animation styles
    const brawlStyles = document.createElement('style');
    brawlStyles.textContent = `
        @keyframes brawlStarFloat {
            0%, 100% { transform: translateY(0) rotate(0deg) scale(1); opacity: 0.2; }
            25% { transform: translateY(-40px) rotate(90deg) scale(1.3); opacity: 0.4; }
            50% { transform: translateY(15px) rotate(180deg) scale(0.8); opacity: 0.25; }
            75% { transform: translateY(-25px) rotate(270deg) scale(1.2); opacity: 0.5; }
        }
        @keyframes brawlGemFloat {
            0%, 100% { transform: translateY(0) rotate(0deg) scale(1); opacity: 0.15; }
            50% { transform: translateY(-30px) rotate(180deg) scale(1.2); opacity: 0.3; }
        }
        @keyframes brawlBurstParticle {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
        }
    `;
    document.head.appendChild(brawlStyles);
})();
</script>
<script src="./pencil-trail.js"></script>
</body>
