<style>
/* ===== LOCAL: caja brawl — PREMIUM ULTRA EDITION ===== */
.brawlbox-overlay {
    position: fixed; inset: 0;
    background:
        radial-gradient(ellipse 120% 80% at 50% 40%, rgba(40,10,80,0.95) 0%, rgba(15,3,40,0.98) 40%, rgba(0,0,0,1) 100%),
        linear-gradient(180deg, rgba(80,20,120,0.3) 0%, transparent 50%, rgba(20,0,60,0.5) 100%);
    z-index: 600; display: flex; flex-direction: column; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; overflow: hidden; transition: opacity 0.5s cubic-bezier(0.4,0,0.2,1);
}
.brawlbox-overlay::before {
    content: ''; position: absolute; inset: 0;
    background:
        radial-gradient(ellipse 80% 50% at 30% 20%, rgba(255,214,10,0.12) 0%, transparent 50%),
        radial-gradient(ellipse 60% 60% at 70% 80%, rgba(255,100,50,0.1) 0%, transparent 50%),
        radial-gradient(ellipse 70% 40% at 50% 50%, rgba(180,50,255,0.08) 0%, transparent 60%),
        radial-gradient(circle at 80% 30%, rgba(0,200,255,0.06) 0%, transparent 40%),
        radial-gradient(circle at 20% 70%, rgba(255,50,150,0.06) 0%, transparent 40%);
    pointer-events: none; z-index: 0;
    animation: overlayPulse 3.5s ease-in-out infinite;
    animation-play-state: var(--anim-play, running);
}
@keyframes overlayPulse {
    0%, 100% { opacity: 0.7; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.02); }
}
.brawlbox-overlay::after {
    content: ''; position: absolute; inset: 0;
    background:
        radial-gradient(circle 300px at var(--mx, 50%) var(--my, 50%), rgba(255,214,10,0.06) 0%, transparent 100%);
    pointer-events: none; z-index: 1;
    transition: background 0.3s ease;
}
.brawlbox-overlay.visible { pointer-events: auto; }
.brawlbox-rays {
    position: absolute; inset: -60%;
    background:
        conic-gradient(from 0deg,
            transparent 0deg, rgba(255,214,10,0.4) 3deg, rgba(255,200,80,0.25) 6deg, transparent 10deg,
            transparent 24deg, rgba(255,120,60,0.3) 27deg, rgba(255,80,80,0.18) 30deg, transparent 34deg,
            transparent 48deg, rgba(200,100,255,0.25) 51deg, rgba(160,50,255,0.15) 54deg, transparent 58deg,
            transparent 72deg, rgba(255,214,10,0.35) 75deg, rgba(255,180,30,0.2) 78deg, transparent 82deg,
            transparent 96deg, rgba(255,80,120,0.28) 99deg, rgba(255,40,80,0.16) 102deg, transparent 106deg,
            transparent 120deg, rgba(80,200,255,0.2) 123deg, rgba(60,150,255,0.12) 126deg, transparent 130deg,
            transparent 144deg, rgba(255,214,10,0.38) 147deg, rgba(255,160,30,0.22) 150deg, transparent 154deg,
            transparent 168deg, rgba(255,100,50,0.3) 171deg, rgba(255,60,80,0.18) 174deg, transparent 178deg,
            transparent 192deg, rgba(180,80,255,0.22) 195deg, rgba(140,40,255,0.14) 198deg, transparent 202deg,
            transparent 216deg, rgba(255,214,10,0.32) 219deg, rgba(255,190,60,0.18) 222deg, transparent 226deg,
            transparent 240deg, rgba(255,60,120,0.25) 243deg, rgba(255,30,80,0.14) 246deg, transparent 250deg,
            transparent 264deg, rgba(100,180,255,0.18) 267deg, rgba(80,140,255,0.1) 270deg, transparent 274deg,
            transparent 288deg, rgba(255,214,10,0.36) 291deg, rgba(255,170,40,0.2) 294deg, transparent 298deg,
            transparent 312deg, rgba(255,80,100,0.26) 315deg, rgba(255,50,60,0.15) 318deg, transparent 322deg,
            transparent 336deg, rgba(150,100,255,0.2) 339deg, rgba(120,60,255,0.12) 342deg, transparent 346deg,
            transparent 360deg
        );
    animation: rayspin 4s linear infinite;
    animation-play-state: var(--anim-play, running);
    filter: blur(0.5px);
}
.brawlbox-rays::before {
    content: ''; position: absolute; inset: 5%;
    background: conic-gradient(from 60deg,
        transparent 0deg, rgba(255,214,10,0.18) 8deg, transparent 16deg,
        transparent 60deg, rgba(255,120,80,0.15) 68deg, transparent 76deg,
        transparent 120deg, rgba(200,150,255,0.12) 128deg, transparent 136deg,
        transparent 180deg, rgba(100,200,255,0.1) 188deg, transparent 196deg,
        transparent 240deg, rgba(255,214,10,0.16) 248deg, transparent 256deg,
        transparent 300deg, rgba(255,80,120,0.13) 308deg, transparent 316deg,
        transparent 360deg
    );
    animation: rayspin 6s linear infinite;
    animation-play-state: var(--anim-play, running);
    opacity: 0.8;
}
.brawlbox-rays::after {
    content: ''; position: absolute; inset: 15%;
    background: conic-gradient(from 180deg,
        transparent 0deg, rgba(255,214,10,0.2) 12deg, transparent 24deg,
        transparent 90deg, rgba(255,100,80,0.16) 102deg, transparent 114deg,
        transparent 180deg, rgba(200,120,255,0.14) 192deg, transparent 204deg,
        transparent 270deg, rgba(255,214,10,0.18) 282deg, transparent 294deg,
        transparent 360deg
    );
    animation: rayspin 7s linear infinite reverse;
    animation-play-state: var(--anim-play, running);
    opacity: 0.6;
}
@keyframes rayspin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.brawlbox-stage { position: relative; width: 260px; height: 260px; z-index: 2; }
.brawlbox-box {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 7.5rem;
    filter: drop-shadow(0 0 30px rgba(255,214,10,1)) drop-shadow(0 0 60px rgba(255,214,10,0.8)) drop-shadow(0 0 100px rgba(255,180,50,0.5)) drop-shadow(0 0 140px rgba(255,100,200,0.3));
    color: #ffd60a;
    animation: boxGlow 1.8s ease-in-out infinite;
    animation-play-state: var(--anim-play, running);
}
@keyframes boxGlow {
    0%, 100% {
        filter: drop-shadow(0 0 30px rgba(255,214,10,1)) drop-shadow(0 0 60px rgba(255,214,10,0.8)) drop-shadow(0 0 100px rgba(255,180,50,0.5)) drop-shadow(0 0 140px rgba(255,100,200,0.3));
        transform: scale(1);
    }
    50% {
        filter: drop-shadow(0 0 50px rgba(255,214,10,1)) drop-shadow(0 0 90px rgba(255,214,10,0.9)) drop-shadow(0 0 130px rgba(255,180,50,0.7)) drop-shadow(0 0 170px rgba(255,100,200,0.5));
        transform: scale(1.03);
    }
}
.brawlbox-glow {
    position: absolute; inset: 0; margin: auto; width: 80px; height: 80px;
    background: radial-gradient(circle, #ffd60a 0%, rgba(255,180,50,0.6) 40%, transparent 70%);
    border-radius: 50%; filter: blur(35px); opacity: 0;
    animation: glowPulse 2s ease-in-out infinite;
    animation-play-state: var(--anim-play, running);
}
@keyframes glowPulse {
    0%, 100% { opacity: 0.6; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.3); }
}
.brawlbox-star {
    position: absolute; width: 50px; height: 50px; opacity: 0;
    color: #ffd60a; fill: currentColor;
    filter: drop-shadow(0 0 15px #ffd60a) drop-shadow(0 0 30px rgba(255,214,10,0.8)) drop-shadow(0 0 45px rgba(255,180,50,0.4));
    animation: starTwinkle 1.2s ease-in-out infinite;
    animation-play-state: var(--anim-play, running);
}
@keyframes starTwinkle {
    0%, 100% { filter: drop-shadow(0 0 15px #ffd60a) drop-shadow(0 0 30px rgba(255,214,10,0.8)) drop-shadow(0 0 45px rgba(255,180,50,0.4)); transform: scale(1) rotate(0deg); }
    50% { filter: drop-shadow(0 0 25px #ffd60a) drop-shadow(0 0 50px rgba(255,214,10,1)) drop-shadow(0 0 70px rgba(255,180,50,0.6)); transform: scale(1.15) rotate(10deg); }
}
.brawlbox-text {
    margin-top: 30px; font-weight: 900; font-family: var(--font-display);
    background: linear-gradient(135deg, #ffd60a 0%, #fff8b0 30%, #ffd60a 50%, #ff9c00 70%, #ffd60a 100%);
    background-size: 200% 200%;
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 10px rgba(255,214,10,0.8)) drop-shadow(0 0 30px rgba(255,214,10,0.4)) drop-shadow(3px 3px 0px #10021f);
    font-size: 2rem; letter-spacing: 0.12em; text-align: center; opacity: 0; z-index: 2; position: relative;
    animation: textGlow 1.8s ease-in-out infinite, textShimmer 3s ease-in-out infinite;
    animation-play-state: var(--anim-play, running);
}
@keyframes textGlow {
    0%, 100% { filter: drop-shadow(0 0 10px rgba(255,214,10,0.8)) drop-shadow(0 0 30px rgba(255,214,10,0.4)) drop-shadow(3px 3px 0px #10021f); }
    50% { filter: drop-shadow(0 0 18px rgba(255,214,10,1)) drop-shadow(0 0 45px rgba(255,214,10,0.6)) drop-shadow(3px 3px 0px #10021f); }
}
@keyframes textShimmer {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
}
.brawlbox-skip {
    position: absolute; bottom: 32px; right: 32px;
    background: rgba(0,0,0,0.6); border: 2px solid rgba(255,214,10,0.4);
    color: rgba(255,214,10,0.9); font-family: var(--font-mono); font-size: 0.78rem;
    padding: 12px 20px; cursor: pointer; z-index: 3;
    opacity: 0.75; transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
    backdrop-filter: blur(12px); border-radius: 4px; letter-spacing: 0.05em;
}
.brawlbox-skip:hover {
    opacity: 1; background: rgba(255,214,10,0.12); border-color: #ffd60a;
    color: #ffd60a; box-shadow: 0 0 20px rgba(255,214,10,0.4), 0 0 40px rgba(255,214,10,0.15);
    transform: translateY(-1px);
}
.brawlbox-skip:active { transform: translateY(0) scale(0.97); }

/* tarjeta de resultado tras la secuencia — PREMIUM */
.result-window {
    max-width: 520px; margin: 80px auto; text-align: center;
    animation: resultAppear 0.7s cubic-bezier(0.23,1,0.32,1) both;
}
@keyframes resultAppear {
    0% { opacity: 0; transform: translateY(40px) scale(0.92) rotateX(5deg); }
    100% { opacity: 1; transform: translateY(0) scale(1) rotateX(0deg); }
}
.result-window .window-body { position: relative; }
/* esquina tipo retícula láser — enhanced */
.result-window .window-body::before {
    content: ''; position: absolute; top: 12px; left: 12px; width: 26px; height: 26px;
    border-top: 3px solid var(--accent); border-left: 3px solid var(--accent);
    opacity: 0.7; pointer-events: none; z-index: 6;
    filter: drop-shadow(0 0 8px var(--accent)) drop-shadow(0 0 15px var(--accent));
    animation: cornerPulse 2s ease-in-out infinite;
    animation-play-state: var(--anim-play, running);
}
.result-window .window-body .corner-br {
    position: absolute; bottom: 12px; right: 12px; width: 26px; height: 26px;
    border-bottom: 3px solid var(--accent); border-right: 3px solid var(--accent);
    opacity: 0.7; pointer-events: none; z-index: 6;
    filter: drop-shadow(0 0 8px var(--accent)) drop-shadow(0 0 15px var(--accent));
    animation: cornerPulse 2s ease-in-out infinite 1s;
    animation-play-state: var(--anim-play, running);
}
@keyframes cornerPulse {
    0%, 100% { opacity: 0.5; filter: drop-shadow(0 0 6px var(--accent)); }
    50% { opacity: 1; filter: drop-shadow(0 0 12px var(--accent)) drop-shadow(0 0 20px var(--accent)); }
}
.result-window .window-body::after {
    content: ''; position: absolute; top: 0; bottom: 0; left: -20%; width: 45%;
    background: linear-gradient(100deg, transparent 20%, rgba(255,255,255,0.6) 50%, transparent 80%);
    transform: translateX(-130%) skewX(-18deg);
    animation: resultShimmer 1.2s cubic-bezier(0.23,1,0.32,1) 0.4s both;
    pointer-events: none; z-index: 6;
}
@keyframes resultShimmer { 0% { transform: translateX(-130%) skewX(-18deg); } 100% { transform: translateX(280%) skewX(-18deg); } }
.result-icon {
    position: relative; width: 96px; height: 96px; margin: 6px auto 18px; color: var(--accent);
    --halo: rgba(236,21,96,0.45);
    animation: iconFloat 3.4s ease-in-out infinite;
    animation-play-state: var(--anim-play, running);
}
@keyframes iconFloat { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-8px) rotate(3deg); } }
.result-icon::before {
    content: ''; position: absolute; inset: -25px; border-radius: 50%;
    background: radial-gradient(circle, var(--halo), transparent 70%);
    filter: blur(8px); pointer-events: none; z-index: 0;
    animation: haloPulse 2.8s ease-in-out infinite;
    animation-play-state: var(--anim-play, running);
}
@keyframes haloPulse { 0%, 100% { opacity: 0.75; transform: scale(1); } 50% { opacity: 1; transform: scale(1.15); } }
/* anillo discontinuo girando alrededor del premio */
.result-icon::after {
    content: ''; position: absolute; inset: -38px; border-radius: 50%;
    border: 2px dashed var(--halo); opacity: 0.5;
    animation: ringSpin 10s linear infinite;
    animation-play-state: var(--anim-play, running);
    pointer-events: none; z-index: 0;
}
@keyframes ringSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.result-icon svg {
    position: relative; width: 100%; height: 100%; z-index: 1;
    filter: drop-shadow(0 0 14px var(--halo)) drop-shadow(0 0 30px var(--halo));
    animation: iconPulse 2s ease-in-out infinite;
    animation-play-state: var(--anim-play, running);
}
@keyframes iconPulse {
    0%, 100% { filter: drop-shadow(0 0 14px var(--halo)) drop-shadow(0 0 30px var(--halo)); }
    50% { filter: drop-shadow(0 0 20px var(--halo)) drop-shadow(0 0 45px var(--halo)); }
}
.result-icon.rarity-epico { --halo: rgba(225,29,72,0.55); }
.result-icon.rarity-especial { --halo: rgba(2,132,199,0.55); }
.result-icon.rarity-super-raro { --halo: rgba(236,23,137,0.55); }
.result-icon.rarity-mitico { --halo: rgba(234,88,12,0.6); }
.result-icon.rarity-legendario { --halo: rgba(255,214,10,0.65); }
.result-icon.rarity-ultralegendario { --halo: rgba(255,214,10,0.9); }
.result-title {
    font-family: var(--font-serif); font-style: italic; font-weight: 700; font-size: 2.2rem;
    letter-spacing: -0.01em; margin-bottom: 10px; color: var(--ink);
    position: relative; display: inline-block;
    text-shadow: 0 2px 8px rgba(0,0,0,0.15), 0 0 20px rgba(236,21,96,0.1);
}
.result-title::after {
    content: ''; position: absolute; left: 0; right: -12px; bottom: -6px; height: 4px;
    background:
        linear-gradient(90deg, transparent 0 6px, var(--accent) 6px 14px, transparent 14px 20px, var(--accent-2) 20px 30px, transparent 30px 36px, var(--accent) 36px 46px, transparent 46px);
    background-size: 46px 4px; opacity: 0.75;
    filter: drop-shadow(0 0 4px var(--accent));
}
.result-desc { font-size: 1.05rem; line-height: 1.8; font-weight: 500; margin-bottom: 26px; }
.result-actions { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }
.result-actions .btn-volver { position: static; }
.btn-replay {
    background: var(--accent); color: var(--card); border: var(--border-w) solid var(--ink);
    padding: 10px 18px; font-weight: 900; font-size: 0.9rem; text-transform: uppercase; cursor: pointer;
    box-shadow: 4px 4px 0 var(--ink); font-family: var(--font-display);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    position: relative; overflow: hidden;
}
.btn-replay::after {
    content: '↻ '; display: inline-block; font-size: 1rem; vertical-align: -1px;
    transition: transform 0.3s ease;
}
.btn-replay:hover::after { transform: rotate(-360deg); }
.btn-replay:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--ink); }
.btn-replay:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
.btn-replay:focus-visible { outline: 3px solid var(--accent-2); outline-offset: 2px; }

/* partículas flotantes decorativas — enhanced */
.brawlbox-particles { position: absolute; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
.brawlbox-particle {
    position: absolute; width: 4px; height: 4px; border-radius: 50%;
    background: var(--p-color, #ffd60a);
    box-shadow: 0 0 8px var(--p-color, #ffd60a), 0 0 16px var(--p-color, #ffd60a), 0 0 24px var(--p-color, #ffd60a);
    opacity: 0;
    animation: particleFloat var(--p-dur, 4s) cubic-bezier(0.25,0.46,0.45,0.94) infinite;
    animation-delay: var(--p-delay, 0s);
    animation-play-state: var(--anim-play, running);
}
@keyframes particleFloat {
    0% { opacity: 0; transform: translateY(100vh) translateX(0) scale(0) rotate(0deg); }
    15% { opacity: 1; }
    50% { transform: translateY(40vh) translateX(var(--p-drift, 20px)) scale(1.2) rotate(180deg); }
    85% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-15vh) translateX(0) scale(0.5) rotate(360deg); }
}
.brawlbox-particle:nth-child(1) { left: 8%; --p-color: #ffd60a; --p-dur: 3.2s; --p-delay: 0s; width: 6px; height: 6px; --p-drift: 15px; }
.brawlbox-particle:nth-child(2) { left: 22%; --p-color: #ff8c00; --p-dur: 3.8s; --p-delay: 0.4s; width: 4px; height: 4px; --p-drift: -20px; }
.brawlbox-particle:nth-child(3) { left: 38%; --p-color: #ffd60a; --p-dur: 3.5s; --p-delay: 0.9s; --p-drift: 25px; }
.brawlbox-particle:nth-child(4) { left: 52%; --p-color: #c850ff; --p-dur: 4.2s; --p-delay: 1.4s; width: 7px; height: 7px; --p-drift: -15px; }
.brawlbox-particle:nth-child(5) { left: 68%; --p-color: #ffd60a; --p-dur: 3s; --p-delay: 0.7s; --p-drift: 10px; }
.brawlbox-particle:nth-child(6) { left: 82%; --p-color: #ff5070; --p-dur: 3.7s; --p-delay: 1.8s; width: 5px; height: 5px; --p-drift: -25px; }
.brawlbox-particle:nth-child(7) { left: 12%; --p-color: #ffb040; --p-dur: 3.3s; --p-delay: 2.3s; width: 5px; height: 5px; --p-drift: 18px; }
.brawlbox-particle:nth-child(8) { left: 58%; --p-color: #ffd60a; --p-dur: 4s; --p-delay: 0.2s; width: 6px; height: 6px; --p-drift: -12px; }
.brawlbox-particle:nth-child(9) { left: 32%; --p-color: #ff6080; --p-dur: 3.6s; --p-delay: 1.6s; --p-drift: 22px; }
.brawlbox-particle:nth-child(10) { left: 76%; --p-color: #c850ff; --p-dur: 3.9s; --p-delay: 1.1s; width: 4px; height: 4px; --p-drift: -18px; }
.brawlbox-particle:nth-child(11) { left: 4%; --p-color: #ffd60a; --p-dur: 3.4s; --p-delay: 2.8s; width: 7px; height: 7px; --p-drift: 14px; }
.brawlbox-particle:nth-child(12) { left: 44%; --p-color: #ff8c00; --p-dur: 4.1s; --p-delay: 0.5s; width: 5px; height: 5px; --p-drift: -22px; }

/* destello decorativo adicional — mega flare */
.brawlbox-flare {
    position: absolute; width: 250px; height: 250px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,214,10,0.3) 0%, rgba(255,180,50,0.15) 30%, transparent 70%);
    top: 50%; left: 50%; transform: translate(-50%, -50%);
    pointer-events: none; z-index: 1; opacity: 0;
    animation: flarePulse 2.5s ease-in-out infinite;
    animation-play-state: var(--anim-play, running);
}
.brawlbox-flare::after {
    content: ''; position: absolute; inset: -30px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,100,200,0.1) 0%, transparent 60%);
    animation: flarePulse 3.5s ease-in-out infinite 0.5s;
    animation-play-state: var(--anim-play, running);
}
@keyframes flarePulse {
    0%, 100% { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
    50% { opacity: 0.7; transform: translate(-50%, -50%) scale(1.4); }
}

/* energy ring around box */
.brawlbox-energy-ring {
    position: absolute; inset: -20px; margin: auto;
    width: 280px; height: 280px; border-radius: 50%;
    border: 2px solid rgba(255,214,10,0.2);
    box-shadow: 0 0 20px rgba(255,214,10,0.15), inset 0 0 20px rgba(255,214,10,0.05);
    animation: ringRotate 6s linear infinite;
    animation-play-state: var(--anim-play, running);
    pointer-events: none; z-index: 2;
}
.brawlbox-energy-ring::before {
    content: ''; position: absolute; inset: 15px; border-radius: 50%;
    border: 1px dashed rgba(255,214,10,0.15);
    animation: ringRotate 8s linear infinite reverse;
    animation-play-state: var(--anim-play, running);
}
@keyframes ringRotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

@media (max-width: 480px) {
    .brawlbox-stage { width: 210px; height: 210px; }
    .brawlbox-box { font-size: 6rem; }
    .brawlbox-text { font-size: 1.5rem; }
    .brawlbox-energy-ring { width: 240px; height: 240px; }
    .result-title { font-size: 1.5rem; }
    .result-window { margin: 60px auto; }
    .result-window .window-body { padding: 20px 16px; }
    .result-actions { flex-direction: column; gap: 10px; }
    .result-actions .btn-volver,
    .btn-replay { width: 100%; text-align: center; }
}
</style>
</head>
<body class="theme-brawl">
    <div class="bg-layer" aria-hidden="true"></div>
    
    <!-- Artwork decorative elements per theme -->
    <div class="theme-artwork cooky-art-1" aria-hidden="true"></div>
    <div class="theme-artwork cooky-art-2" aria-hidden="true"></div>
    <div class="theme-artwork cooky-art-3" aria-hidden="true"></div>
    <div class="theme-artwork joji-art-1" aria-hidden="true"></div>
    <div class="theme-artwork joji-art-2" aria-hidden="true"></div>
    <div class="theme-artwork brawl-art-1" aria-hidden="true"></div>
    <div class="theme-artwork brawl-art-2" aria-hidden="true"></div>
    <div class="theme-artwork brawl-art-3" aria-hidden="true"></div>
    
    <main class="container" id="app"></main>

    <!-- estructura requerida por playBrawlBoxSequence (shared.js) -->
    <div class="brawlbox-overlay" id="brawlboxOverlay">
        <div class="brawlbox-rays"></div>
        <div class="brawlbox-particles">
            <div class="brawlbox-particle"></div>
            <div class="brawlbox-particle"></div>
            <div class="brawlbox-particle"></div>
            <div class="brawlbox-particle"></div>
            <div class="brawlbox-particle"></div>
            <div class="brawlbox-particle"></div>
            <div class="brawlbox-particle"></div>
            <div class="brawlbox-particle"></div>
            <div class="brawlbox-particle"></div>
            <div class="brawlbox-particle"></div>
            <div class="brawlbox-particle"></div>
            <div class="brawlbox-particle"></div>
        </div>
        <div class="brawlbox-flare"></div>
        <button type="button" class="brawlbox-skip" id="brawlboxSkip">saltar</button>
        <div class="brawlbox-stage">
            <div class="brawlbox-energy-ring"></div>
            <div class="brawlbox-glow" id="brawlboxGlow"></div>
            <div class="brawlbox-box" id="brawlboxBox">
                <svg viewBox="0 0 24 24" fill="currentColor" width="120" height="120"><path d="M20 6h-4V4c0-1.1-.9-2-2-2h-4c-1.1 0-2 .9-2 2v2H4c-1.1 0-2 .9-2 2v11c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zM10 4h4v2h-4V4zm10 15H4V8h16v11z"/><circle cx="12" cy="13" r="2" fill="#10021f"/></svg>
            </div>
            <svg class="brawlbox-star" id="star1" style="top:5%; left:5%;" viewBox="0 0 24 24"><path d="M12 2l3 7 7 1-5 5 1 7-6-4-6 4 1-7-5-5 7-1z"/></svg>
            <svg class="brawlbox-star" id="star2" style="top:2%; right:10%;" viewBox="0 0 24 24"><path d="M12 2l3 7 7 1-5 5 1 7-6-4-6 4 1-7-5-5 7-1z"/></svg>
            <svg class="brawlbox-star" id="star3" style="bottom:5%; left:15%;" viewBox="0 0 24 24"><path d="M12 2l3 7 7 1-5 5 1 7-6-4-6 4 1-7-5-5 7-1z"/></svg>
            <svg class="brawlbox-star" id="star4" style="bottom:10%; right:5%;" viewBox="0 0 24 24"><path d="M12 2l3 7 7 1-5 5 1 7-6-4-6 4 1-7-5-5 7-1z"/></svg>
        </div>
        <p class="brawlbox-text" id="brawlboxText">abriendo mega caja...</p>
    </div>
<script>
function loadConfetti() {
    return new Promise((resolve) => {
        if (typeof confetti === 'function') return resolve();
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js';
        s.onload = resolve;
        document.head.appendChild(s);
    });
}
(function initMegaBox(){
    const app = document.getElementById('app');
    const reward = getRewardFromContext();
    const reduced = prefersReducedMotion();

    if (reduced) {
        document.body.style.setProperty('--anim-play', 'paused');
    } else {
        document.addEventListener('visibilitychange', () => {
            document.body.style.setProperty('--anim-play', document.hidden ? 'paused' : 'running');
        });
    }

    document.body.className = 'theme-brawl';

    function renderError(){
        app.innerHTML = `
            <div class="window-card error-window result-window">
                <div class="window-header"><span>mega_caja.exe</span><span class="window-dots"><span class="dot dot-red"></span><span class="dot dot-yellow"></span><span class="dot dot-green"></span></span></div>
                <div class="window-body">
                    <span class="error-icon" aria-hidden="true">🎁</span>
                    <h2>ESTA CAJA ESPERA TU CÓDIGO</h2>
                    <p>Abre el cofre y canjea un código ultralegendario para abrir la Mega Caja.</p>
                    <a class="btn-volver" style="position:static; margin:0 auto;" href="javascript:void(0)" onclick="goBackToChest()">← volver al cofre</a>
                </div>
            </div>`;
    }

    function renderResult(r){
        const rarityName = (RARITY_META[r.rarity] || {}).name || r.rarity;
        app.innerHTML = `
            <div class="window-card result-window">
                <div class="window-header">
                    <span>premio_revelado.exe</span>
                    <span class="window-dots"><span class="dot dot-red"></span><span class="dot dot-yellow"></span><span class="dot dot-green"></span></span>
                </div>
                <div class="window-body">
                    <span class="corner-br"></span>
                    <span class="rarity-tag rarity-${r.rarity}" aria-label="Rareza: ${rarityName}">${rarityName}</span>
                    <div class="result-icon rarity-${r.rarity}" aria-hidden="true">${r.icon}</div>
                    <h1 class="result-title">${r.title}</h1>
                    <p class="result-desc">${r.desc}</p>
                    <div class="result-actions">
                        <a class="btn-volver" href="javascript:void(0)" onclick="goBackToChest()">← volver al cofre</a>
                        <button type="button" class="btn-replay" id="replayBtn">ver de nuevo</button>
                    </div>
                </div>
            </div>`;
        document.getElementById('replayBtn').addEventListener('click', () => {
            document.getElementById('app').style.display = 'none';
            playBrawlBoxSequence(r);
        });
    }

    if (!reward) { renderError(); return; }

    /* al terminar la secuencia (o al saltar) se muestra el resultado */
    window.brawlBoxCompleted = (r) => {
        if (!r) return;
        document.getElementById('app').style.display = '';
        renderResult(r);
    };

    loadConfetti();
    /* la secuencia arranca sola al cargar; el resultado aparece al cerrar */
    (function startSequence() {
        if (typeof anime !== 'undefined') {
            playBrawlBoxSequence(reward);
        } else {
            window.addEventListener('load', function() {
                playBrawlBoxSequence(reward);
            });
        }
    })();

    /* ==========================================================================
       BRAWL STARS ENHANCED EFFECTS (mega-box.html)
       ========================================================================== */
    
    // Add floating Brawl Stars particles — ULTRA EDITION
    function addBrawlFloatingElements() {
        // Remove old if re-initialized
        document.querySelectorAll('.brawl-float').forEach(el => el.remove());

        // Floating stars
        for (let i = 0; i < 10; i++) {
            const star = document.createElement('div');
            star.className = 'brawl-float';
            const colors = ['#ffd60a', '#17d4ff', '#ff2d55', '#7c3aed', '#00ff88', '#ff8c00'];
            star.style.cssText = `
                position: fixed;
                width: ${12 + Math.random() * 22}px;
                height: ${12 + Math.random() * 22}px;
                left: ${Math.random() * 100}%;
                top: ${Math.random() * 100}%;
                background: ${colors[Math.floor(Math.random() * colors.length)]};
                clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
                opacity: ${0.12 + Math.random() * 0.18};
                pointer-events: none;
                z-index: 1;
                filter: drop-shadow(0 0 4px currentColor);
                animation: brawlStarFloat ${7 + Math.random() * 12}s ease-in-out infinite;
                animation-delay: ${Math.random() * 6}s;
            `;
            document.body.appendChild(star);
        }

        // Floating gems
        for (let i = 0; i < 6; i++) {
            const gem = document.createElement('div');
            gem.className = 'brawl-float';
            const gradients = [
                'linear-gradient(135deg, #00e5ff, #7c3aed)',
                'linear-gradient(135deg, #ffd60a, #ff8c00)',
                'linear-gradient(135deg, #ff2d55, #ff8c00)',
                'linear-gradient(135deg, #00ff88, #17d4ff)'
            ];
            gem.style.cssText = `
                position: fixed;
                width: ${8 + Math.random() * 16}px;
                height: ${8 + Math.random() * 16}px;
                left: ${Math.random() * 100}%;
                top: ${Math.random() * 100}%;
                background: ${gradients[Math.floor(Math.random() * gradients.length)]};
                clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
                opacity: ${0.1 + Math.random() * 0.12};
                pointer-events: none;
                z-index: 1;
                filter: drop-shadow(0 0 6px rgba(124,58,237,0.5));
                animation: brawlGemFloat ${9 + Math.random() * 10}s ease-in-out infinite;
                animation-delay: ${Math.random() * 6}s;
            `;
            document.body.appendChild(gem);
        }

        // Floating tiny sparks
        for (let i = 0; i < 15; i++) {
            const spark = document.createElement('div');
            spark.className = 'brawl-float';
            spark.style.cssText = `
                position: fixed;
                width: ${2 + Math.random() * 4}px;
                height: ${2 + Math.random() * 4}px;
                left: ${Math.random() * 100}%;
                top: ${Math.random() * 100}%;
                background: #fff;
                border-radius: 50%;
                opacity: ${0.08 + Math.random() * 0.12};
                pointer-events: none;
                z-index: 1;
                box-shadow: 0 0 6px rgba(255,214,10,0.6);
                animation: brawlSparkFloat ${5 + Math.random() * 8}s ease-in-out infinite;
                animation-delay: ${Math.random() * 6}s;
            `;
            document.body.appendChild(spark);
        }
    }
    
    // Click/tap burst effect
    document.addEventListener('click', (e) => {
        if (!e.target.closest('button, a')) {
            createBrawlBurst(e.clientX, e.clientY);
        }
    });
    
    document.addEventListener('touchstart', (e) => {
        if (!e.target.closest('button, a')) {
            const touch = e.touches[0];
            createBrawlBurst(touch.clientX, touch.clientY);
        }
    }, { passive: true });
    
    const brawlBurstParticles = [];
    function createBrawlBurst(x, y) {
        const colors = ['#ffd60a', '#17d4ff', '#ff2d55', '#7c3aed', '#ffffff', '#00ff88', '#ff8c00'];
        const count = 14 + Math.floor(Math.random() * 6);
        for (let i = 0; i < count; i++) {
            if (brawlBurstParticles.length >= 50) {
                const oldest = brawlBurstParticles.shift();
                if (oldest && oldest.parentNode) oldest.remove();
            }
            const particle = document.createElement('div');
            const size = 3 + Math.random() * 8;
            const isStar = Math.random() < 0.3;
            particle.style.cssText = `
                position: fixed;
                left: ${x}px;
                top: ${y}px;
                width: ${size}px;
                height: ${size}px;
                background: ${colors[Math.floor(Math.random() * colors.length)]};
                ${isStar ? `clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);` : 'border-radius: 50%;'}
                pointer-events: none;
                z-index: 1000;
                box-shadow: 0 0 ${4 + Math.random() * 6}px currentColor;
                animation: brawlBurstParticle ${0.5 + Math.random() * 0.7}s cubic-bezier(0.25,0.46,0.45,0.94) forwards;
                --tx: ${(Math.random() - 0.5) * 350}px;
                --ty: ${(Math.random() - 0.5) * 350 - 50}px;
            `;
            brawlBurstParticles.push(particle);
            document.body.appendChild(particle);
            particle.addEventListener('animationend', () => {
                const idx = brawlBurstParticles.indexOf(particle);
                if (idx !== -1) brawlBurstParticles.splice(idx, 1);
                particle.remove();
            }, { once: true });
            setTimeout(() => {
                const idx = brawlBurstParticles.indexOf(particle);
                if (idx !== -1) brawlBurstParticles.splice(idx, 1);
                particle.remove();
            }, 2000);
        }
    }
    
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', addBrawlFloatingElements);
    } else {
        addBrawlFloatingElements();
    }
    
    // Add animation styles
    const brawlStyles = document.createElement('style');
    brawlStyles.textContent = `
        @keyframes brawlStarFloat {
            0%, 100% { transform: translateY(0) rotate(0deg) scale(1); opacity: 0.2; }
            25% { transform: translateY(-50px) rotate(90deg) scale(1.4); opacity: 0.45; }
            50% { transform: translateY(20px) rotate(180deg) scale(0.7); opacity: 0.25; }
            75% { transform: translateY(-30px) rotate(270deg) scale(1.3); opacity: 0.55; }
        }
        @keyframes brawlGemFloat {
            0%, 100% { transform: translateY(0) rotate(0deg) scale(1); opacity: 0.15; }
            33% { transform: translateY(-35px) rotate(120deg) scale(1.3); opacity: 0.35; }
            66% { transform: translateY(15px) rotate(240deg) scale(0.8); opacity: 0.2; }
        }
        @keyframes brawlSparkFloat {
            0%, 100% { transform: translateY(0) translateX(0); opacity: 0.1; }
            25% { transform: translateY(-30px) translateX(15px); opacity: 0.25; }
            50% { transform: translateY(-10px) translateX(-10px); opacity: 0.05; }
            75% { transform: translateY(-40px) translateX(5px); opacity: 0.3; }
        }
        @keyframes brawlBurstParticle {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
        }
        @keyframes brawlEnergyRing {
            0% { transform: rotate(0deg) scale(1); opacity: 0.6; }
            50% { transform: rotate(180deg) scale(1.05); opacity: 0.8; }
            100% { transform: rotate(360deg) scale(1); opacity: 0.6; }
        }
    `;
    document.head.appendChild(brawlStyles);

    // Mouse-follow glow on overlay
    const brawlOverlay = document.getElementById('brawlboxOverlay');
    brawlOverlay.addEventListener('mousemove', (e) => {
        const x = (e.clientX / window.innerWidth) * 100;
        const y = (e.clientY / window.innerHeight) * 100;
        brawlOverlay.style.setProperty('--mx', x + '%');
        brawlOverlay.style.setProperty('--my', y + '%');
    }, { passive: true });
})();
</script>
