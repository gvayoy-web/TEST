<style>
/* ===== LOCAL: ambiente + tarjeta flotante + selector de tema ===== */
body { min-height: 100vh; display: flex; align-items: center; }
.theme-frame {
    position: fixed; inset: 12px; border: 12px solid var(--ink); z-index: 1; pointer-events: none;
    box-shadow:
        inset 0 0 60px rgba(0,0,0,0.25),
        inset 0 0 120px rgba(var(--grain-color, 200,200,200), 0.06),
        0 0 30px rgba(var(--grain-color, 200,200,200), 0.08);
    overflow: hidden;
    transition: box-shadow 0.8s ease;
}
/* línea de escaneo que recorre el marco de ambiente */
.theme-frame::before {
    content: ''; position: absolute; left: 0; right: 0; height: 60px; z-index: 2;
    background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.07), transparent);
    animation: frameScan 7s linear infinite;
    animation-play-state: var(--anim-play, running);
}
@keyframes frameScan { 0% { top: -60px; } 100% { top: 100%; } }
/* esquina superior izquierda tipo retícula láser */
.theme-frame::after {
    content: ''; position: absolute; top: 18px; left: 18px; width: 34px; height: 34px; z-index: 3;
    border-top: 3px solid var(--accent); border-left: 3px solid var(--accent);
    opacity: 0.85; animation: cornerPulse 2.6s ease-in-out infinite;
    animation-play-state: var(--anim-play, running);
    box-shadow: -3px -3px 0 rgba(var(--grain-color),0.15);
}
@keyframes cornerPulse {
    0%, 100% { opacity: 0.35; filter: drop-shadow(0 0 0 transparent); }
    50% { opacity: 0.95; filter: drop-shadow(0 0 8px var(--accent-glow)); }
}
/* partículas ambientales flotantes por tema (CSS puro) */
.theme-frame .pt {
    position: absolute; width: 7px; height: 7px; border-radius: 50%;
    left: var(--x); top: var(--y); opacity: 0;
    animation: particleDrift 8s ease-in-out infinite;
    animation-delay: calc(var(--i) * -1.25s);
    animation-play-state: var(--anim-play, running);
    will-change: transform, opacity;
}
.theme-cooky .theme-frame .pt { background: #ff9ec2; box-shadow: 0 0 9px #ff9ec2; }
.theme-joji .theme-frame .pt { background: #8a97b8; box-shadow: 0 0 9px #8a97b8; }
.theme-brawl .theme-frame .pt { background: #2dd4ff; box-shadow: 0 0 9px #2dd4ff; }
.theme-brawl .theme-frame .pt:nth-child(3n) { background: #ffd60a; box-shadow: 0 0 9px #ffd60a; }
@keyframes particleDrift {
    0% { transform: translateY(0) translateX(0); opacity: 0; }
    12% { opacity: 0.75; }
    50% { transform: translateY(-28px) translateX(12px); opacity: 0.95; }
    88% { opacity: 0.5; }
    100% { transform: translateY(6px) translateX(-8px); opacity: 0; }
}
.theme-switcher {
    position: fixed; top: 26px; right: 26px; z-index: 1000; display: flex; gap: 8px;
}
.theme-switcher button {
    background: rgba(255,255,255,0.08); backdrop-filter: blur(10px) saturate(1.4);
    color: var(--ink); border: 1.5px solid rgba(var(--grain-color, 180,180,180), 0.25);
    font-family: var(--font-mono); font-size: 0.66rem; font-weight: 700; letter-spacing: 0.08em;
    padding: 8px 13px; cursor: pointer; border-radius: 6px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12), inset 0 1px 0 rgba(255,255,255,0.15); opacity: 0.88;
    transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    text-shadow: 0 0 1px rgba(var(--grain-color, 180,180,180), 0.3);
}
.theme-switcher button:hover {
    transform: translateY(-2px) scale(1.04);
    box-shadow: 0 4px 16px rgba(0,0,0,0.18), 0 0 12px rgba(var(--grain-color, 200,200,200), 0.12);
    opacity: 1;
    border-color: var(--accent);
}
.theme-switcher button.active {
    background: var(--accent); color: var(--card); opacity: 1; border-color: var(--accent);
    box-shadow: 0 0 20px rgba(var(--grain-color, 200,200,200), 0.25), 0 2px 8px rgba(0,0,0,0.2);
    transform: translateY(-1px);
}
.theme-switcher button:focus-visible { outline: 3px solid var(--accent-2); outline-offset: 3px; }

.vibe-card {
    max-width: 520px; margin: 80px auto 40px;
    border-color: var(--accent) !important;
    border-width: 2px !important;
    background: rgba(255,255,255,0.18) !important;
    backdrop-filter: blur(10px) saturate(1.2);
    -webkit-backdrop-filter: blur(10px) saturate(1.2);
    box-shadow:
        0 0 20px rgba(var(--grain-color, 200,200,200), 0.15),
        0 0 60px rgba(var(--grain-color, 200,200,200), 0.08),
        inset 0 1px 0 rgba(255,255,255,0.2);
    transition: box-shadow 0.5s ease, transform 0.5s ease;
}
.vibe-card:hover {
    box-shadow:
        0 0 30px rgba(var(--grain-color, 200,200,200), 0.15),
        0 0 80px rgba(var(--grain-color, 200,200,200), 0.06),
        inset 0 1px 0 rgba(255,255,255,0.18);
    transform: translateY(-2px);
}
.vibe-kicker {
    font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.18em; text-transform: uppercase;
    opacity: 0.6; margin-bottom: 10px; display: inline-block; padding: 4px 10px;
    border: 1px solid currentColor; position: relative;
}
.vibe-kicker::before { content: '◆ '; color: var(--accent-2); }
.vibe-title {
    font-family: var(--font-serif); font-style: italic; font-weight: 700; font-size: 2.3rem;
    letter-spacing: -0.01em; margin-bottom: 12px; color: var(--ink);
    position: relative; display: inline-block;
    text-shadow:
        0 0 4px rgba(var(--grain-color, 200,200,200), 0.3),
        0 0 14px rgba(var(--grain-color, 200,200,200), 0.12),
        0 0 40px rgba(var(--grain-color, 200,200,200), 0.06);
}
.vibe-title::after {
    content: ''; position: absolute; left: 0; right: -10px; bottom: -6px; height: 4px;
    background:
        linear-gradient(90deg, transparent 0 6px, var(--accent) 6px 14px, transparent 14px 20px, var(--accent-2) 20px 30px, transparent 30px 36px, var(--accent) 36px 46px, transparent 46px);
    background-size: 46px 4px; opacity: 0.85;
    filter: drop-shadow(0 0 6px var(--accent)) drop-shadow(0 0 12px rgba(var(--grain-color, 200,200,200), 0.3));
}
.vibe-desc { font-size: 1.08rem; line-height: 1.85; font-weight: 500; margin-bottom: 18px; }
.vibe-note {
    font-family: var(--font-hand); font-size: 2rem; line-height: 1.4; max-width: 90%;
    overflow-wrap: break-word; transform: rotate(-1.2deg); color: var(--accent); margin: 16px 0 28px;
    position: relative; padding: 14px 18px 14px 26px;
    background: rgba(255,255,255,0.03);
    border-left: 3px solid var(--accent);
    border-radius: 0 8px 8px 0;
    text-shadow: 0 0 20px rgba(var(--grain-color, 200,200,200), 0.2);
}
.vibe-note::before {
    content: '"'; position: absolute; left: -8px; top: -12px; font-family: var(--font-serif);
    font-size: 4.4rem; line-height: 1; color: var(--accent-2); opacity: 0.6;
    filter: drop-shadow(0 0 8px var(--accent-2));
}
.vibe-link {
    display: inline-flex; align-items: center; gap: 8px; background: var(--accent); color: var(--card);
    border: var(--border-w) solid var(--ink); padding: 12px 18px; font-weight: 900; font-size: 0.9rem;
    text-transform: uppercase; text-decoration: none; cursor: pointer; box-shadow: 4px 4px 0 var(--ink);
    margin-bottom: 24px; transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    position: relative; overflow: hidden;
    background-image: linear-gradient(135deg, var(--accent), var(--accent-2), var(--accent));
    background-size: 200% 200%;
    animation: vibeLinkShimmer 4s ease-in-out infinite;
}
@keyframes vibeLinkShimmer {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
}
.vibe-link::after {
    content: ''; position: absolute; top: -60%; left: -60%; width: 50%; height: 220%;
    background: linear-gradient(105deg, transparent, rgba(255,255,255,0.4), transparent);
    transform: skewX(-20deg); transition: left 0.5s ease;
}
.vibe-link:hover {
    transform: translate(-2px, -2px);
    box-shadow: 6px 6px 0 var(--ink), 0 0 25px var(--accent-glow), 0 0 50px rgba(var(--grain-color, 200,200,200), 0.15);
}
.vibe-link:hover::after { left: 160%; }
.vibe-link:hover .arrow { transform: translateX(4px); }
.vibe-link .arrow { display: inline-block; transition: transform 0.15s ease; }
.vibe-link:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
.vibe-actions { margin-top: 26px; }
.vibe-actions .btn-volver { position: static; }

@media (max-width: 480px) {
    .theme-frame { inset: 6px; border-width: 6px; }
    .vibe-title { font-size: 1.6rem; }
    .vibe-note { font-size: 1.4rem; }
    .theme-switcher { top: 16px; right: 16px; gap: 6px; }
    .theme-switcher button { padding: 6px 10px; font-size: 0.6rem; }
    .vibe-card { margin: 60px auto 30px; }
}
@media (max-width: 400px) { .vibe-note { transform: rotate(-0.6deg); } }
/* Fondos de tema más opacos para legibilidad */
body.theme-cooky .vibe-card { background: rgba(255,245,248,0.88) !important; }
body.theme-joji .vibe-card { background: rgba(22,24,31,0.9) !important; }
body.theme-brawl .vibe-card { background: rgba(69,27,120,0.88) !important; color: #fff; }
</style>
</head>
<body class="theme-cooky">
    <div class="bg-layer" aria-hidden="true"></div>
    
    <!-- Artwork decorative elements per theme -->
    <div class="theme-artwork cooky-art-1" aria-hidden="true"></div>
    <div class="theme-artwork cooky-art-2" aria-hidden="true"></div>
    <div class="theme-artwork cooky-art-3" aria-hidden="true"></div>
    <div class="theme-artwork joji-art-1" aria-hidden="true"></div>
    <div class="theme-artwork joji-art-2" aria-hidden="true"></div>
    <div class="theme-artwork brawl-art-1" aria-hidden="true"></div>
    <div class="theme-artwork brawl-art-2" aria-hidden="true"></div>
    <div class="theme-artwork brawl-art-3" aria-hidden="true"></div>
    
    <div class="theme-frame" aria-hidden="true">
        <span class="pt" style="--x:14%; --y:16%; --i:0;"></span>
        <span class="pt" style="--x:82%; --y:22%; --i:1;"></span>
        <span class="pt" style="--x:28%; --y:70%; --i:2;"></span>
        <span class="pt" style="--x:66%; --y:78%; --i:3;"></span>
        <span class="pt" style="--x:48%; --y:12%; --i:4;"></span>
        <span class="pt" style="--x:90%; --y:55%; --i:5;"></span>
        <span class="pt" style="--x:8%; --y:48%; --i:6;"></span>
        <span class="pt" style="--x:56%; --y:88%; --i:7;"></span>
    </div>
    <div class="theme-switcher" role="group" aria-label="Cambiar ambiente">
        <button type="button" data-theme="cooky" title="cambiar a ambiente cooky" aria-pressed="false">COOKY</button>
        <button type="button" data-theme="joji" title="cambiar a ambiente joji" aria-pressed="false">JOJI</button>
        <button type="button" data-theme="brawl" title="cambiar a ambiente brawl" aria-pressed="false">BRAWL</button>
    </div>
    <main class="container" id="app"></main>
<script>
(function initImmersive(){
    const reduced = prefersReducedMotion();
    if (reduced) {
        document.body.style.setProperty('--anim-play', 'paused');
    } else {
        document.addEventListener('visibilitychange', () => {
            document.body.style.setProperty('--anim-play', document.hidden ? 'paused' : 'running');
        });
    }

    /* notas cortas por experiencia (edítalas aquí para cada código) */
    const NOTES_BY_CODE = {
        JOJI: 'Sé que mucho te gusta Joji, y quiero que lo compartas conmigo. Pon tu canción favorita de Joji, mira el techo y quédate un rato sintiendo la música. Así me siento cada vez que pienso en ti.',
        PINTURA: 'Pintamos algo juntos. Tú eliges los colores, como soy péssimo pintando, doy apoyo emocional.',
        BTS: 'Cupón válido para una noche de música y conciertos de BTS juntos.',
        FNAF: 'Noche de FNAF con sustos, pizza y muchos besos. Miremos o juguemos esa franquicia que nos unió y, gracias a ella, no nos separaremos.',
        ANIME: 'Maratón de anime completo. Tú eliges la serie, yo traigo las palomitas. Sé que te encanta el anime, y como tu novio quiero verte feliz viendo lo que te gusta a mi lado.',
        FELICES16: 'Hoy cumples años, y yo quiero que sigas cumpliendo más a la par mía. Espero que me des pastel JAJAJA. Feliz cumpleañitos mi amor, cuídate y recuerda que eres la mujer más hermosa del mundo.'
    };

    const reward = getRewardFromContext();

    function setTheme(theme){
        // Add transition class for smooth theme switching
        document.body.classList.add('theme-switching');
        
        // Create transition overlay
        const overlay = document.createElement('div');
        overlay.className = 'page-transition';
        overlay.style.background = `var(--accent)`;
        document.body.appendChild(overlay);
        
        // Trigger transition
        requestAnimationFrame(() => {
            overlay.classList.add('active');
        });
        
        setTimeout(() => {
            document.body.className = 'theme-' + theme;
            try { document.cookie = 'theme=' + theme + '; path=/; SameSite=Lax; max-age=31536000'; } catch (e) {}
            document.querySelectorAll('.theme-switcher button').forEach(b => {
                const active = b.dataset.theme === theme;
                b.classList.toggle('active', active);
                b.setAttribute('aria-pressed', String(active));
                b.title = active ? 'ambiente activo' : 'cambiar a ambiente ' + b.dataset.theme;
            });
            
            // Remove transition class
            document.body.classList.remove('theme-switching');
            
            // Reverse overlay
            overlay.classList.remove('active');
            setTimeout(() => {
                overlay.remove();
            }, 500);
        }, 250);
    }

    function renderError(){
        const app = document.getElementById('app');
        app.innerHTML = `
            <div class="window-card error-window vibe-card">
                <div class="window-header"><span>experiencia.exe</span><span class="window-dots"><span class="dot dot-red"></span><span class="dot dot-yellow"></span><span class="dot dot-green"></span></span></div>
                <div class="window-body">
                    <span class="error-icon" aria-hidden="true">🎧</span>
                    <h2>ESTA EXPERIENCIA ESPERA TU CÓDIGO</h2>
                    <p>Abre el cofre y canjea un código para desbloquear este ambiente.</p>
                    <a class="btn-volver" style="position:static; margin:0 auto;" href="javascript:void(0)" onclick="goBackToChest()">← volver al cofre</a>
                </div>
            </div>`;
    }

    function renderReward(r){
        const app = document.getElementById('app');
        const note = NOTES_BY_CODE[r.code] || 'esta experiencia existe para recordarte que cada momento contigo es único.';
        let linkHtml = '';
        if (r.special === 'spotify' && r.link) {
            linkHtml = `<a class="vibe-link" href="${r.link}" target="_blank" rel="noopener noreferrer">abrir playlist en spotify <span class="arrow">→</span></a>`;
        }
        app.innerHTML = `
            <div class="window-card vibe-card">
                <div class="window-header">
                    <span>experiencia_${r.code.toLowerCase()}.exe</span>
                    <span class="window-dots"><span class="dot dot-red"></span><span class="dot dot-yellow"></span><span class="dot dot-green"></span></span>
                </div>
                <div class="window-body">
                    <p class="vibe-kicker">${r.label} · ambiente ${r.theme || 'propio'}</p>
                    <h1 class="vibe-title">${r.title}</h1>
                    <p class="vibe-desc">${r.desc}</p>
                    <p class="vibe-note">${note}</p>
                    ${linkHtml}
                    <div class="vibe-actions">
                        <a class="btn-volver" href="javascript:void(0)" onclick="goBackToChest()">← volver al cofre</a>
                    </div>
                </div>
            </div>`;
    }

    /* tema: primero lo que el usuario haya guardado manualmente, luego el del premio, luego default */
    const saved = (function(){ try { return document.cookie.match(/(?:^|; )theme=([^;]+)/)?.[1] || null; } catch (e) { return null; } })();
    const theme = saved || (reward && reward.theme) || 'cooky';
    setTheme(theme);
    document.querySelectorAll('.theme-switcher button').forEach(btn => {
        btn.addEventListener('click', () => setTheme(btn.dataset.theme));
    });

    if (!reward) { renderError(); } else { renderReward(reward); }

    /* ==========================================================================
       ENHANCED INTERACTIVE EFFECTS PER THEME (immersive.html)
       ========================================================================== */
    const _trailParticles = [];
    const MAX_TRAIL_PARTICLES = 25;

    function createThemeParticles(x, y) {
        const theme = document.body.className.replace('theme-', '');
        const colors = {
            cooky: ['#ec1560', '#f0b429', '#ff9ec2', '#fffaf9'],
            joji: ['#d43a53', '#8a97b8', '#4a5568', '#eeece7'],
            brawl: ['#ffd60a', '#ff2d55', '#17d4ff', '#7c3aed']
        };
        const themeColors = colors[theme] || colors.cooky;

        for (let i = 0; i < 6; i++) {
            const particle = document.createElement('div');
            particle.className = 'star-particle';
            particle.style.cssText = `
                left: ${x}px;
                top: ${y}px;
                --tx: ${(Math.random() - 0.5) * 150}px;
                --ty: ${(Math.random() - 0.5) * 150}px;
                background: ${themeColors[Math.floor(Math.random() * themeColors.length)]};
                box-shadow: 0 0 10px ${themeColors[Math.floor(Math.random() * themeColors.length)]};
            `;
            document.body.appendChild(particle);
            _trailParticles.push(particle);
            particle.addEventListener('animationend', () => {
                const idx = _trailParticles.indexOf(particle);
                if (idx !== -1) _trailParticles.splice(idx, 1);
                particle.remove();
            }, { once: true });
            setTimeout(() => {
                const idx = _trailParticles.indexOf(particle);
                if (idx !== -1) _trailParticles.splice(idx, 1);
                particle.remove();
            }, 1200);
        }

        while (_trailParticles.length > MAX_TRAIL_PARTICLES) {
            const oldest = _trailParticles.shift();
            if (oldest) oldest.remove();
        }
    }
    
    document.addEventListener('click', (e) => {
        if (!e.target.closest('button, a, .theme-switcher button')) {
            createThemeParticles(e.clientX, e.clientY);
        }
    });
    
    // Enhanced rain for Joji (idempotente)
    function enhanceJojiRain() {
        if (document.body.classList.contains('theme-joji') && !document.querySelector('.joji-rain-overlay')) {
            const rainOverlay = document.createElement('div');
            rainOverlay.className = 'joji-rain-overlay';
            rainOverlay.style.cssText = `
                position: fixed;
                inset: 0;
                pointer-events: none;
                z-index: 1;
                opacity: 0.2;
                background-image: 
                    repeating-linear-gradient(100deg, transparent 0px, transparent 38px, rgba(212,58,83,0.15) 39px, transparent 41px);
                animation: rainfall 6s linear infinite;
                animation-play-state: var(--anim-play, running);
            `;
            document.body.appendChild(rainOverlay);
        }
    }
    
    // Enhanced stars for Brawl (idempotente)
    function enhanceBrawlStars() {
        if (document.body.classList.contains('theme-brawl') && !document.querySelector('.brawl-floating-star')) {
            for (let i = 0; i < 4; i++) {
                const star = document.createElement('div');
                star.className = 'brawl-floating-star';
                star.style.cssText = `
                    position: fixed;
                    width: ${12 + Math.random() * 18}px;
                    height: ${12 + Math.random() * 18}px;
                    left: ${Math.random() * 100}%;
                    top: ${Math.random() * 100}%;
                    background: ${['#ffd60a', '#17d4ff', '#ff2d55', '#7c3aed'][Math.floor(Math.random() * 4)]};
                    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
                    opacity: 0.15;
                    pointer-events: none;
                    z-index: 1;
                    animation: brawlStarFloat ${10 + Math.random() * 12}s ease-in-out infinite;
                    animation-delay: ${Math.random() * 5}s;
                `;
                document.body.appendChild(star);
            }
        }
    }
    
    function initThemeEnhancements() {
        enhanceJojiRain();
        enhanceBrawlStars();
    }
    
    // Re-ejecutar sólo cuando cambia la clase del tema
    let themeObserver = null;
    function watchThemeChanges() {
        if (themeObserver) return;
        themeObserver = new MutationObserver(() => {
            requestAnimationFrame(initThemeEnhancements);
        });
        themeObserver.observe(document.body, { attributes: true, attributeFilter: ['class'] });
    }
    
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => { initThemeEnhancements(); watchThemeChanges(); });
    } else {
        initThemeEnhancements();
        watchThemeChanges();
    }
    
    // Add brawl star float animation
    const brawlStarStyle = document.createElement('style');
    brawlStarStyle.textContent = `
        @keyframes brawlStarFloat {
            0%, 100% { transform: translateY(0) rotate(0deg) scale(1); opacity: 0.15; }
            25% { transform: translateY(-30px) rotate(90deg) scale(1.2); opacity: 0.3; }
            50% { transform: translateY(10px) rotate(180deg) scale(0.9); opacity: 0.2; }
            75% { transform: translateY(-20px) rotate(270deg) scale(1.1); opacity: 0.4; }
        }
    `;
    document.head.appendChild(brawlStarStyle);
})();
</script>
